    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('theme'); } catch (e) {}
        document.documentElement.setAttribute('data-theme',
          stored ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

    <style type="text/css">

      [data-theme="dark"] a { color: #b58900 }
      html, body, #tbl_wrap { height: 100%; width: 100%; padding: 0; margin: 0; }
      body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      #container, #container canvas { -webkit-tap-highlight-color: transparent; }
      #td_wrap { vertical-align: middle; text-align: center; }
      #bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }

        #container { width: 66vw; height: 66vw; max-width: 420px; max-height: 420px; }
        #bottom-spacer { margin-bottom: 40px; }
      }

</head>

<script type="module">
let theme = document.documentElement.getAttribute('data-theme') || 'light';

document.getElementById('year').textContent = new Date().getFullYear();

function setTheme(t) {
    theme = t;
    try { localStorage.setItem('theme', t); } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
    updateColors();
    updateThemeToggle();
}

const tsToggle = document.getElementById('ts-toggle');
function updateThemeToggle() {
    const isDark = theme === 'dark';
    tsToggle.setAttribute('aria-pressed', String(isDark));
    tsToggle.textContent = isDark ? 'light' : 'dark';
}
tsToggle.addEventListener('click', () => setTheme(theme === 'dark' ? 'light' : 'dark'));
updateThemeToggle();

function hexToRgb(hex) {
    const v = parseInt(hex.slice(1), 16);
    return [(v >> 16) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255];
}

const themeColors = {
    light: ['#fdf6e3', '#839496'],
    dark:  ['#002b36', '#073642'],
};

let bg;

function updateColors() {
    const [c1, c2] = themeColors[theme] || themeColors.light;
    if (bg) bg.setColors(hexToRgb(c1), hexToRgb(c2));
}

const fragmentShaders = [
    'shaders/flag.frag',
    'shaders/liquidate.frag',
    'shaders/foil.frag',
    'shaders/poly.frag',
    'shaders/grid.frag',
    'shaders/phong.frag',
];

const okText = (p) => (r) => {
    if (!r.ok) throw new Error(p + ': HTTP ' + r.status);
    return r.text();
};

const mainShadersPromise = Promise.all(fragmentShaders.map(p => fetch(p).then(okText(p))));
const plasmaPromise = fetch('shaders/plasma.frag')
    .then(okText('shaders/plasma.frag'))
    .catch(e => { console.error('plasma init:', e); return null; });

let shaderSources = [];
let swapShader;
let shaderIndex = 0;

try {
    shaderSources = await mainShadersPromise;
    shaderIndex = Math.floor(Math.random() * fragmentShaders.length);

    const params = new URLSearchParams(window.location.search);
    if (params.has('shader')) {
        const idx = fragmentShaders.indexOf('shaders/' + params.get('shader') + '.frag');
        if (idx !== -1) shaderIndex = idx;
    }

    swapShader = initGL(document, shaderSources[shaderIndex]);
} catch (e) { console.error('shaders init:', e); }

const plasmaSrc = await plasmaPromise;
if (plasmaSrc) {
    bg = initBG(document, plasmaSrc);
    updateColors();
}

document.body.addEventListener('click', (e) => {
    if (!swapShader || !shaderSources.length) return;
    if (e.target.closest('a, button')) return;
    shaderIndex = (shaderIndex + 1) % fragmentShaders.length;
    requestAnimationFrame(() => swapShader(shaderSources[shaderIndex]));
});
</script>
