<script type="module">
const mq = window.matchMedia('(prefers-color-scheme: dark)');
let theme = localStorage.getItem('theme') || (mq.matches ? 'dark' : 'light');

function applyTheme() {
  document.documentElement.setAttribute('data-theme', theme);
  const other = theme === 'dark' ? 'light' : 'dark';
  document.getElementById('ts').innerHTML = theme === 'dark'
    ? '<a href="javascript:void(0)">light</a> / dark'
    : 'light / <a href="javascript:void(0)">dark</a>';
  document.getElementById('ts').querySelector('a').onclick = () => {
    theme = other;
    localStorage.setItem('theme', theme);
    applyTheme();
  };
}
applyTheme();
</script>
<script type="module">
const fragmentShaders = [
    'shaders/flag.frag',
    'shaders/liquidate.frag',
    'shaders/foil.frag',
    'shaders/poly.frag',
    'shaders/grid.frag',
    'shaders/phong.frag',
];

const shaderSources = await Promise.all(fragmentShaders.map(p => fetch(p).then(r => r.text())));

let shaderIndex = Math.floor(Math.random() * fragmentShaders.length);

const params = new URLSearchParams(window.location.search);
if (params.has('shader')) {
    const shader = params.get('shader');
    const idx = fragmentShaders.indexOf('shaders/' + shader + '.frag');
    if (idx !== -1) shaderIndex = idx;
}

const swapShader = initGL(document, shaderSources[shaderIndex]);

document.getElementById('container').addEventListener('click', () => {
    shaderIndex = (shaderIndex + 1) % fragmentShaders.length;
    requestAnimationFrame(() => swapShader(shaderSources[shaderIndex]));
});
</script>
