<script type="module">
const mq = window.matchMedia('(prefers-color-scheme: dark)');
let theme = localStorage.getItem('theme') || (mq.matches ? 'dark' : 'light');

document.documentElement.setAttribute('data-theme', theme);

document.getElementById('ts-light').addEventListener('click', (e) => {
    e.preventDefault();
    theme = 'light';
    localStorage.setItem('theme', theme);
    document.documentElement.setAttribute('data-theme', theme);
    updateColors();
});

document.getElementById('ts-dark').addEventListener('click', (e) => {
    e.preventDefault();
    theme = 'dark';
    localStorage.setItem('theme', theme);
    document.documentElement.setAttribute('data-theme', theme);
    updateColors();
});

function hexToRgb(hex) {
    const v = parseInt(hex.slice(1), 16);
    return [(v >> 16) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255];
}

const themeColors = {
    light: ['#fdf6e3', '#839496'],
    dark:  ['#002b36', '#073642'],
};

let bg;

function updateColors() {
    const [c1, c2] = themeColors[theme];
    if (bg) bg.setColors(hexToRgb(c1), hexToRgb(c2));
}

const fragmentShaders = [
    'shaders/flag.frag',
    'shaders/liquidate.frag',
    'shaders/foil.frag',
    'shaders/poly.frag',
    'shaders/grid.frag',
    'shaders/phong.frag',
];

let shaderSources = [];
let swapShader;
let shaderIndex = 0;

try {
    shaderSources = await Promise.all(fragmentShaders.map(p => fetch(p).then(r => r.text())));
    shaderIndex = Math.floor(Math.random() * fragmentShaders.length);

    const params = new URLSearchParams(window.location.search);
    if (params.has('shader')) {
        const shader = params.get('shader');
        const idx = fragmentShaders.indexOf('shaders/' + shader + '.frag');
        if (idx !== -1) shaderIndex = idx;
    }

    swapShader = initGL(document, shaderSources[shaderIndex]);
} catch (e) { console.error('shaders init:', e); }

try {
    const plasmaSrc = await fetch('shaders/plasma.frag').then(r => r.text());
    bg = initBG(document, plasmaSrc);
    updateColors();
} catch (e) { console.error('plasma init:', e); }

document.body.addEventListener('click', (e) => {
    if (!swapShader || !shaderSources.length) return;
    if (e.target.tagName === 'A' || e.target.closest('a')) return;
    shaderIndex = (shaderIndex + 1) % fragmentShaders.length;
    requestAnimationFrame(() => swapShader(shaderSources[shaderIndex]));
});
</script>
